name: PR Tests

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: create-tiers-pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    name: Harness contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact checkout head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Test verification harness
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

  core:
    name: JVM tests and builds
    needs: harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Run all JVM tests and builds
        run: ./gradlew testAllTargets buildAllTargets --stacktrace --no-daemon
      - name: Preserve JVM/build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-verification
          path: |
            forge-1.20.1/build/test-results/**
            forge-1.20.1/build/reports/tests/**
            neoforge-1.21.1/build/test-results/**
            neoforge-1.21.1/build/reports/tests/**
          if-no-files-found: ignore

  required-core:
    name: Required core verification
    if: always()
    needs: [harness, core]
    runs-on: ubuntu-latest
    steps:
      - name: Require all core layers
        env:
          HARNESS_RESULT: ${{ needs.harness.result }}
          CORE_RESULT: ${{ needs.core.result }}
        shell: bash
        run: |
          test "$HARNESS_RESULT" = success
          test "$CORE_RESULT" = success
