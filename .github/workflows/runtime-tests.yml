name: Runtime GameTests

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: create-tiers-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    name: Select runtime matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: matrix
        shell: bash
        run: echo "value=$(python3 tools/runtime_verification.py --matrix)" >> "$GITHUB_OUTPUT"

  gametest:
    name: GameTest (${{ matrix.target }})
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Run target GameTests with evidence
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 tools/runtime_verification.py
          --target "${{ matrix.target }}"
          --head "$EXACT_HEAD"
      - name: Write exact-head pass receipt
        if: success()
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CREATE_TIERS_TARGET: ${{ matrix.target }}
        run: >-
          python3 tools/runtime_verification.py
          --write-receipt build/runtime-results
          --head "$EXACT_HEAD"
      - name: Upload exact-head pass receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-result-${{ matrix.target }}
          path: build/runtime-results/*.pass
          if-no-files-found: error
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence-${{ matrix.target }}
          path: |
            build/runtime-evidence/**
            ${{ matrix.target }}/run/logs/**
            ${{ matrix.target }}/run/crash-reports/**
          if-no-files-found: ignore

  required-runtime:
    name: Required runtime verification
    if: always()
    needs: [select, gametest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download exact-head receipts
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-result-*
          path: build/runtime-results
          merge-multiple: true
      - name: Verify exact-head receipt set
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SELECT_RESULT: ${{ needs.select.result }}
          MATRIX_RESULT: ${{ needs.gametest.result }}
        shell: bash
        run: |
          test "$SELECT_RESULT" = success
          test "$MATRIX_RESULT" = success
          python3 tools/runtime_verification.py \
            --verify-receipts build/runtime-results \
            --head "$EXACT_HEAD"
