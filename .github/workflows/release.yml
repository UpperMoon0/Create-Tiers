name: Release

on:
  push:
    branches: [main]
    paths:
      - gradle.properties

permissions:
  contents: read

concurrency:
  group: create-tiers-release
  cancel-in-progress: false

jobs:
  version-change:
    name: Check mod version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compare mod_version with previous main revision
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          read_version() {
            sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' \
              | head -n1 | tr -d '\r' | xargs
          }

          current="$(read_version < gradle.properties)"
          [[ "$current" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]] \
            || { echo "Invalid mod_version: $current" >&2; exit 1; }

          [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]] \
            || { echo "Cannot resolve previous main revision; refusing to infer a release." >&2; exit 1; }
          git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null \
            || { echo "Previous main revision $BEFORE_SHA is unavailable." >&2; exit 1; }

          previous="$(git show "${BEFORE_SHA}:gradle.properties" | read_version)"
          echo "mod_version: ${previous} -> ${current}"

          changed=false
          if [[ "$current" != "$previous" ]]; then
            changed=true
            tag="v${current}"
            if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
              tagged_commit="$(git rev-list -n 1 "refs/tags/$tag")"
              echo "Tag $tag already exists at $tagged_commit; use a new mod_version." >&2
              exit 1
            fi
            echo "Version bump detected."
          else
            echo "mod_version is unchanged; nothing will be published."
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "value=$current" >> "$GITHUB_OUTPUT"

  core:
    name: Core verification
    needs: version-change
    if: needs.version-change.outputs.changed == 'true'
    uses: ./.github/workflows/pr-tests.yml

  runtime:
    name: Runtime verification
    needs: version-change
    if: needs.version-change.outputs.changed == 'true'
    uses: ./.github/workflows/runtime-tests.yml

  package:
    name: Package verified release
    needs: [version-change, core, runtime]
    if: needs.version-change.outputs.changed == 'true' && needs.core.result == 'success' && needs.runtime.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Package both loaders
        run: |
          chmod +x gradlew
          ./gradlew buildAllTargets -x test --stacktrace --no-daemon

      - name: Verify release inputs and extract release notes
        shell: bash
        env:
          MOD_VERSION: ${{ needs.version-change.outputs.value }}
        run: |
          set -euo pipefail

          forge="forge-1.20.1/build/libs/create-tiers-forge-1.20.1-${MOD_VERSION}.jar"
          neoforge="neoforge-1.21.1/build/libs/create-tiers-neoforge-1.21.1-${MOD_VERSION}.jar"
          [[ -f "$forge" ]] || { echo "Missing Forge release JAR: $forge" >&2; exit 1; }
          [[ -f "$neoforge" ]] || { echo "Missing NeoForge release JAR: $neoforge" >&2; exit 1; }

          mkdir -p build
          awk -v version="$MOD_VERSION" '
            $0 == "## " version { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > build/release-notes.md
          [[ -s build/release-notes.md ]] \
            || { echo "Missing CHANGELOG.md section for version $MOD_VERSION" >&2; exit 1; }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: create-tiers-release-${{ needs.version-change.outputs.value }}
          path: |
            forge-1.20.1/build/libs/create-tiers-forge-1.20.1-${{ needs.version-change.outputs.value }}.jar
            neoforge-1.21.1/build/libs/create-tiers-neoforge-1.21.1-${{ needs.version-change.outputs.value }}.jar
            build/release-notes.md
          if-no-files-found: error

  publish-curseforge:
    name: Publish ${{ matrix.loader_name }} ${{ matrix.minecraft }} to CurseForge
    needs: [version-change, package]
    if: needs.version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: forge
            loader_name: Forge
            minecraft: '1.20.1'
            java_version_name: Java 17
          - platform: neoforge
            loader_name: NeoForge
            minecraft: '1.21.1'
            java_version_name: Java 21

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: create-tiers-release-${{ needs.version-change.outputs.value }}
          path: release-artifact

      - name: Select release JAR and notes
        id: release_file
        shell: bash
        env:
          MOD_VERSION: ${{ needs.version-change.outputs.value }}
          PLATFORM: ${{ matrix.platform }}
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
        run: |
          set -euo pipefail
          expected="create-tiers-${PLATFORM}-${MINECRAFT_VERSION}-${MOD_VERSION}.jar"
          mapfile -t jars < <(find release-artifact -type f -name "$expected" | sort)
          [[ ${#jars[@]} -eq 1 ]] \
            || { echo "Expected exactly one $expected; found ${#jars[@]}" >&2; exit 1; }
          notes="$(find release-artifact -type f -name release-notes.md -print -quit)"
          [[ -n "$notes" && -s "$notes" ]] \
            || { echo "Missing release notes artifact." >&2; exit 1; }
          echo "jar_path=${jars[0]}" >> "$GITHUB_OUTPUT"
          echo "notes_path=$notes" >> "$GITHUB_OUTPUT"

      - name: Publish to CurseForge project 1487875
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: '1487875'
          MOD_VERSION: ${{ needs.version-change.outputs.value }}
          JAR_PATH: ${{ steps.release_file.outputs.jar_path }}
          NOTES_PATH: ${{ steps.release_file.outputs.notes_path }}
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
          LOADER_NAME: ${{ matrix.loader_name }}
          JAVA_VERSION_NAME: ${{ matrix.java_version_name }}
        run: |
          set -euo pipefail

          [[ -n "${CURSEFORGE_API_TOKEN:-}" ]] \
            || { echo "Missing required GitHub secret: CURSEFORGE_API_TOKEN" >&2; exit 1; }
          [[ -f "$JAR_PATH" ]] || { echo "Missing release JAR: $JAR_PATH" >&2; exit 1; }
          [[ -s "$NOTES_PATH" ]] || { echo "Missing release notes: $NOTES_PATH" >&2; exit 1; }

          tags="$(jq -cn \
            --arg mc "$MINECRAFT_VERSION" \
            --arg loader "$LOADER_NAME" \
            --arg java "$JAVA_VERSION_NAME" \
            '[$mc, $loader, $java, "Client", "Server"]')"

          available="$(curl --fail-with-body --silent --show-error \
            --retry 4 --retry-max-time 90 --connect-timeout 15 --max-time 45 \
            --header "X-Api-Token: $CURSEFORGE_API_TOKEN" \
            https://minecraft.curseforge.com/api/game/versions)"

          while IFS= read -r tag; do
            jq -e --arg tag "$tag" 'any(.[]; .name == $tag)' <<< "$available" >/dev/null \
              || { echo "CurseForge does not recognize game version tag: $tag" >&2; exit 1; }
          done < <(jq -r '.[]' <<< "$tags")

          relations='{"projects":[{"slug":"create","type":"requiredDependency"}]}'
          metadata="$(jq -cn \
            --rawfile changelog "$NOTES_PATH" \
            --arg displayName "Create Tiers ${MOD_VERSION} - ${LOADER_NAME} ${MINECRAFT_VERSION}" \
            --argjson gameVersionNames "$tags" \
            --argjson relations "$relations" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersionNames: $gameVersionNames,
              releaseType: "release",
              relations: $relations
            }')"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error \
            --retry 4 --retry-max-time 90 --connect-timeout 15 --max-time 60 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "X-Api-Token: $CURSEFORGE_API_TOKEN" \
            --form-string "metadata=$metadata" \
            --form "file=$@{JAR_PATH}" \
            "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file")"
          response="$(<"$response_file")"

          if [[ "$http_status" =~ ^2 ]]; then
            echo "Published $JAR_PATH to CurseForge project $CURSEFORGE_PROJECT_ID as file $(jq -er '.id' <<< "$response")."
          elif grep -Eqi 'already|duplicate' <<< "$response"; then
            echo "CurseForge already has $JAR_PATH; treating this retry as successful."
          else
            echo "CurseForge upload failed with HTTP $http_status: $response" >&2
            exit 1
          fi

  publish-github-release:
    name: Publish GitHub Release
    needs: [version-change, package, publish-curseforge]
    if: needs.version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: create-tiers-release-${{ needs.version-change.outputs.value }}
          path: release-artifact

      - name: Select release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          notes="$(find release-artifact -type f -name release-notes.md -print -quit)"
          [[ -n "$notes" && -s "$notes" ]] || { echo "Missing release notes artifact." >&2; exit 1; }
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-change.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: "Create Tiers v${{ needs.version-change.outputs.value }}"
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-artifact/**/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
