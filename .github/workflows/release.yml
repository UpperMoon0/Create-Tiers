name: Build and Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: create-tiers-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build both loaders and run unit tests
        run: ./gradlew --parallel :forge-1.20.1:build :neoforge-1.21.1:build

      - name: Run NeoForge GameTests
        timeout-minutes: 5
        run: ./gradlew :neoforge-1.21.1:runGameTestServer

      - name: Get version
        if: github.event_name == 'push'
        id: get_version
        run: |
          echo "version=$(grep 'mod_version' gradle.properties | cut -d'=' -f2 | xargs)" >> $GITHUB_OUTPUT

      - name: Publish Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: "Create: Tiers v${{ steps.get_version.outputs.version }}"
          draft: false
          prerelease: false
          files: |
            forge-1.20.1/build/libs/create-tiers-forge-1.20.1-${{ steps.get_version.outputs.version }}.jar
            neoforge-1.21.1/build/libs/create-tiers-neoforge-1.21.1-${{ steps.get_version.outputs.version }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
