name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: create-tiers-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    name: Core verification
    uses: ./.github/workflows/pr-tests.yml

  runtime:
    name: Runtime verification
    uses: ./.github/workflows/runtime-tests.yml

  publish:
    name: Publish exact verified head
    needs: [core, runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Package both loaders
        run: ./gradlew buildAllTargets -x test --stacktrace --no-daemon
      - name: Read mod version
        id: version
        shell: bash
        run: |
          value="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          test -n "$value"
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Create Tiers v${{ steps.version.outputs.value }}
          draft: false
          prerelease: false
          files: |
            forge-1.20.1/build/libs/create-tiers-forge-1.20.1-${{ steps.version.outputs.value }}.jar
            neoforge-1.21.1/build/libs/create-tiers-neoforge-1.21.1-${{ steps.version.outputs.value }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
