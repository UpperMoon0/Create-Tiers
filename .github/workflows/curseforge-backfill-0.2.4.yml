name: CurseForge Backfill v0.2.4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/curseforge-backfill-0.2.4.yml

permissions:
  contents: read

concurrency:
  group: create-tiers-curseforge-backfill-0.2.4
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.loader_name }} ${{ matrix.minecraft }} to CurseForge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: forge
            loader_name: Forge
            minecraft: '1.20.1'
            java_version_name: Java 17
          - platform: neoforge
            loader_name: NeoForge
            minecraft: '1.21.1'
            java_version_name: Java 21

    steps:
      - name: Checkout released source
        uses: actions/checkout@v6
        with:
          ref: v0.2.4
          fetch-depth: 0

      - name: Download exact GitHub release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          gh release download v0.2.4 \
            --repo UpperMoon0/Create-Tiers \
            --pattern "create-tiers-${PLATFORM}-${MINECRAFT_VERSION}-0.2.4.jar" \
            --dir release-artifact

      - name: Extract v0.2.4 release notes
        shell: bash
        run: |
          set -euo pipefail
          awk '
            $0 == "## 0.2.4" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-artifact/release-notes.md
          [[ -s release-artifact/release-notes.md ]] \
            || { echo "Missing CHANGELOG.md section for 0.2.4" >&2; exit 1; }

      - name: Select exact release JAR
        id: release_file
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
        run: |
          set -euo pipefail
          expected="create-tiers-${PLATFORM}-${MINECRAFT_VERSION}-0.2.4.jar"
          mapfile -t jars < <(find release-artifact -maxdepth 1 -type f -name "$expected" | sort)
          [[ ${#jars[@]} -eq 1 ]] \
            || { echo "Expected exactly one $expected; found ${#jars[@]}" >&2; exit 1; }
          echo "jar_path=${jars[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish exact v0.2.4 asset to CurseForge project 1487875
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: '1487875'
          JAR_PATH: ${{ steps.release_file.outputs.jar_path }}
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
          LOADER_NAME: ${{ matrix.loader_name }}
          JAVA_VERSION_NAME: ${{ matrix.java_version_name }}
        run: |
          set -euo pipefail

          [[ -n "${CURSEFORGE_API_TOKEN:-}" ]] \
            || { echo "Missing required GitHub secret: CURSEFORGE_API_TOKEN" >&2; exit 1; }

          tags="$(jq -cn \
            --arg mc "$MINECRAFT_VERSION" \
            --arg loader "$LOADER_NAME" \
            --arg java "$JAVA_VERSION_NAME" \
            '[$mc, $loader, $java, "Client", "Server"]')"

          available="$(curl --fail-with-body --silent --show-error \
            --retry 4 --retry-max-time 90 --connect-timeout 15 --max-time 45 \
            --header "X-Api-Token: $CURSEFORGE_API_TOKEN" \
            https://minecraft.curseforge.com/api/game/versions)"
          while IFS= read -r tag; do
            jq -e --arg tag "$tag" 'any(.[]; .name == $tag)' <<< "$available" >/dev/null \
              || { echo "CurseForge does not recognize game version tag: $tag" >&2; exit 1; }
          done < <(jq -r '.[]' <<< "$tags")

          relations='{"projects":[{"slug":"create","type":"requiredDependency"}]}'
          metadata="$(jq -cn \
            --rawfile changelog release-artifact/release-notes.md \
            --arg displayName "Create Tiers 0.2.4 - ${LOADER_NAME} ${MINECRAFT_VERSION}" \
            --argjson gameVersionNames "$tags" \
            --argjson relations "$relations" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersionNames: $gameVersionNames,
              releaseType: "release",
              relations: $relations
            }')"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error \
            --retry 4 --retry-max-time 90 --connect-timeout 15 --max-time 60 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "X-Api-Token: $CURSEFORGE_API_TOKEN" \
            --form-string "metadata=$metadata" \
            --form "file=@${JAR_PATH}" \
            "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file")"
          response="$(<"$response_file")"

          if [[ "$http_status" =~ ^2 ]]; then
            echo "Published $JAR_PATH to CurseForge project $CURSEFORGE_PROJECT_ID as file $(jq -er '.id' <<< "$response")."
          elif grep -Eqi 'already|duplicate' <<< "$response"; then
            echo "CurseForge already has $JAR_PATH; treating this retry as successful."
          else
            echo "CurseForge upload failed with HTTP $http_status: $response" >&2
            exit 1
          fi
